<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HBO Max Clone</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="header">

        <nav class="navigation">

            <div class="logo">
                HBO MAX
            </div>

            <div class="nav-links">
                <a href="#">Início</a>
                <a href="#">Séries</a>
                <a href="#">Filmes</a>
                <a href="#">Originais</a>
            </div>

            <div class="header-buttons">
                <button class="login-button">Entrar</button>
                <button class="subscribe-button">Assine agora</button>
            </div>

        </nav>

    </header>

    <main>

        <section class="hero">

            <div class="hero-content">

                <h1>HISTÓRIAS INCRÍVEIS COMEÇAM AQUI</h1>

                <p>
                    Descubra filmes, séries e produções exclusivas
                    em um só lugar.
                </p>

                <button class="hero-button">
                    Explore agora
                </button>

            </div>

            <div class="hero-image">
                <img src="../img/h.png" alt="Destaque de entretenimento">
            </div>

        </section>

        <section class="catalog">

            <h2>Filmes e séries em destaque</h2>

            <div class="catalog-grid">

                <article class="movie-card">
                    <img src="../img/h1.png" alt="Filme em destaque">
                    <h3>Grande Aventura</h3>
                </article>

                <article class="movie-card">
                    <img src="../img/h2.png" alt="Série em destaque">
                    <h3>Mundo Desconhecido</h3>
                </article>

                <article class="movie-card">
                    <img src="../img/h3.png" alt="Produção em destaque">
                    <h3>Além do Tempo</h3>
                </article>

                <article class="movie-card">
                    <img src="../img/h4.png" alt="Filme em destaque">
                    <h3>O Último Reino</h3>
                </article>

            </div>

        </section>

    </main>

    <footer class="footer">
        <p>Projeto educacional inspirado em plataformas de streaming.</p>
    </footer>

</body>

</html>
